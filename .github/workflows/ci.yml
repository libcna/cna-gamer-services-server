# SPDX-License-Identifier: MIT
name: CI

# The same qualification a maintainer runs locally (HANDOFF.md, tools/qualify.sh), on the Linux
# host the service is tested for. The tests that drive real CNA processes need CNA's harnesses,
# which this checkout does not have, so they report exit 77 and CTest counts them as skipped --
# never as passed. The NAT-isolated variants are among them, so no user namespace is needed here.
on:
  push:
    branches: [develop, next, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # tools/qualify.sh honours an explicit CCACHE_DIR; keep the cache inside the workspace so
  # actions/cache can carry it between runs.
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CC: gcc-14
  CXX: g++-14

jobs:
  qualify:
    name: Build, tests and documentation (Linux, GCC 14)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build ccache g++-14 \
            libssl-dev libsqlite3-dev libboost-dev nlohmann-json3-dev \
            python3 python3-venv openssl

      - name: Install the pinned Python test client
        # A venv on PATH, so CMake's find_package(Python3) selects the interpreter that has the
        # pinned websockets from tests/requirements.txt.
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r tests/requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-gcc14-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-gcc14-${{ runner.os }}-

      - name: Build, run every configured test, check the offline documentation
        run: tools/qualify.sh full

      - name: Report the configured version
        run: build-agent/cna-gamer-services-server --version

  security:
    name: ASan/UBSan unit suites (Linux, GCC 14)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build ccache g++-14 \
            libssl-dev libsqlite3-dev libboost-dev nlohmann-json3-dev python3

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-asan-gcc14-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-asan-gcc14-${{ runner.os }}-

      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer, run the unit suites serially
        run: tools/qualify.sh security
