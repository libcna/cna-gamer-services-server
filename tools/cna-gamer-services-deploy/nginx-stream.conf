# L4 passthrough example. Include this from nginx.conf in a build with the stream module.
# The service still terminates TLS; relay and event WebSocket upgrades pass through unchanged.
stream {
    upstream cna_gamer_services {
        server 127.0.0.1:47831;
    }

    server {
        listen 443 reuseport;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_pass cna_gamer_services;
    }
}
