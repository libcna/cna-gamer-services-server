services:
  gamer-services:
    build:
      context: ../../..
      dockerfile: tools/cna-gamer-services-deploy/container/Dockerfile
    restart: unless-stopped
    ports:
      - "47831:47831"
    volumes:
      - gamer-services-data:/var/lib/cna-gamer-services
    secrets:
      - certificate.pem
      - private-key.pem
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=0700
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:47832/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  gamer-services-data:

secrets:
  certificate.pem:
    file: ./secrets/certificate.pem
  private-key.pem:
    file: ./secrets/private-key.pem
